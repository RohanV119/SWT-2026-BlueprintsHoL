# =============================================================================
# Data Product Setup - FintechCorp Payments Core (PROD)
# Blueprint: blueprint_2db08610
# Project: alex_demo_prefilled
# Created: 2026-08-10
#
# This blueprint is repeatable. There is one answer file per data product per
# environment. This is the PROD file; see answers_payments_core_stg.yaml and
# answers_payments_core_dev.yaml for the other two.
#
# Generated object prefix (Single Account strategy):
#   PAYMENTS_CORE_PROD
# So databases become PAYMENTS_CORE_PROD_RAW / _CURATED / _ANALYTICS, warehouses
# become PAYMENTS_CORE_PROD_WH_<workload>, roles become PAYMENTS_CORE_PROD_ADMIN
# / _CREATE / _READ. This is how dev, staging and prod stay separated by database
# and role inside one account.
# =============================================================================

# -----------------------------------------------------------------------------
# TASK 1 - DATA PRODUCT PLANNING
# -----------------------------------------------------------------------------

# STEP: select-target-account
# AUTO-ANSWERED: inherited from the Platform Foundation answers.
account_strategy: Single Account
target_account_name: FINTECHCORP

# Inherited platform context
snowflake_org_name: FINTECHCORP
object_component_order: <domain>_<dataproduct>_<env>
platform_database_name: INFRA
governance_name: GOVERNANCE

# STEP: define-data-product-identity
# ASSUMPTION: "core" is the primary payments data product - the transaction and
# settlement backbone. Start here and repeat the blueprint for adjacent products
# (fraud, chargebacks, merchant onboarding) once this pattern is proven.
data_product_name: core
data_product_domain: payments
data_product_environment: prod
data_product_description: >-
  Core payments data product. Card transactions, bank transfers, settlements and
  the merchant and customer records they reference. Serves regulatory reporting,
  settlement reconciliation, and fraud and risk modelling.

# AUTO-ANSWERED: derived from scim_provisioner_role OKTA_PROVISIONER in the
# Platform Foundation answers.
scim_prefix: OKTA

# STEP: configure-zone-structure
# ASSUMPTION: three zones. Raw holds untransformed source data, curated holds
# conformed and deduplicated entities, analytics holds aggregates and reporting
# models. Separating raw from curated matters here because raw payment data holds
# unmasked PANs and account numbers that most users should never reach.
#
# AUTO-ANSWERED on retention: 30 days Time Travel in prod, exactly as specified.
data_zones:
  - name: raw
    description: Untransformed source data from the payment gateway, card networks, core banking and the merchant portal. Restricted access - contains unmasked cardholder and bank account data.
    time_travel_days: 30
  - name: curated
    description: Conformed, deduplicated and masked payment entities. The system of record for downstream consumers.
    time_travel_days: 30
  - name: analytics
    description: Aggregates, reporting models and feature tables for risk and fraud modelling.
    time_travel_days: 30

# STEP: plan-schema-organization
# ASSUMPTION: schemas inferred from a card-and-transfer payments business. Adjust
# to your actual source systems.
schema_configuration:
  - zone: raw
    schemas: card_transactions, bank_transfers, merchants, customers, ledger_entries, gateway_events
  - zone: curated
    schemas: transactions, settlements, merchants, customers, chargebacks, ledger
  - zone: analytics
    schemas: revenue, settlement_reconciliation, fraud_features, merchant_performance, regulatory_reporting

# STEP: plan-warehouse-requirements
# ASSUMPTION: one warehouse per workload, sized for your three teams. Separate
# warehouses (rather than one shared one) are what make the cost allocation tags
# usable - you cannot attribute spend by team if every team shares a warehouse.
#
#   LOAD      data engineering (10) - ingestion, short bursty statements
#   TRANSFORM data engineering (10) - dbt or scheduled transforms
#   REPORT    analytics (15)        - BI and ad hoc query, scales out for concurrency
#   SCIENCE   data science (6)      - feature engineering and training, few large queries
warehouse_configuration:
  - name: LOAD
    workload: LOAD
    size: SMALL
    min_cluster_count: 1
    max_cluster_count: 2
    auto_suspend_seconds: 60
    timeout_minutes: 60
    comment: Ingestion warehouse for payments core prod. Short auto-suspend because loads are bursty.
  - name: TRANSFORM
    workload: TRANSFORM
    size: MEDIUM
    min_cluster_count: 1
    max_cluster_count: 3
    auto_suspend_seconds: 300
    timeout_minutes: 120
    comment: Scheduled transformation warehouse for payments core prod.
  - name: REPORT
    workload: REPORT
    size: SMALL
    min_cluster_count: 1
    max_cluster_count: 3
    auto_suspend_seconds: 120
    timeout_minutes: 30
    comment: BI and ad hoc query warehouse for the analytics team. Multi-cluster for concurrency, short timeout to catch runaway queries.
  - name: SCIENCE
    workload: SCIENCE
    size: LARGE
    min_cluster_count: 1
    max_cluster_count: 1
    auto_suspend_seconds: 300
    timeout_minutes: 240
    comment: Feature engineering and model training warehouse for the data science team.

# -----------------------------------------------------------------------------
# TASK 4 - CONSUMER ACCESS
# -----------------------------------------------------------------------------

# STEP: create-custom-read-roles
# ASSUMPTION: three consumer roles that deliberately exclude the raw zone, so no
# custom read role can reach unmasked cardholder data. Grant raw access only via
# PAYMENTS_CORE_PROD_READ to a small named group.
#
# schema_access is a comma-separated list of zone.schema (or a bare zone for all
# schemas in it).
custom_read_roles:
  - name: ANALYST
    description: Analytics team. Reporting models and aggregates only, no raw or unmasked data.
    schema_access: analytics
  - name: DATA_SCIENTIST
    description: Data science team. Curated entities plus analytics feature tables for model development.
    schema_access: curated, analytics
  - name: COMPLIANCE_AUDITOR
    description: Compliance and external audit. Regulatory reporting and settlement reconciliation only.
    schema_access: analytics.regulatory_reporting, analytics.settlement_reconciliation

# -----------------------------------------------------------------------------
# TASK 5 - DATA PRODUCT COST MANAGEMENT
# -----------------------------------------------------------------------------

# ASSUMPTION: 1800 of the 3000 account credits go to prod. Together with 400 for
# staging and 400 for dev this totals 2600, leaving 400 credits of headroom under
# the account-level monitor so a single environment cannot suspend the whole
# account.
resource_monitor_credits: 1800
resource_monitor_frequency: MONTHLY

# ASSUMPTION: routed to the org admin you named. Replace with the payments data
# product owner or a team distribution list.
notification_email: alex@fintechcorp.com
