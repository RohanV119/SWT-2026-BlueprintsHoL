# =============================================================================
# Data Product Setup - FintechCorp Payments Core (DEV)
# Blueprint: blueprint_2db08610
# Project: alex_demo_prefilled
# Created: 2026-08-10
#
# Generated object prefix: PAYMENTS_CORE_DEV
# Dev is where the data engineering team builds. 1-day Time Travel, smallest
# compute, and no production cardholder data.
# =============================================================================

# -----------------------------------------------------------------------------
# TASK 1 - DATA PRODUCT PLANNING
# -----------------------------------------------------------------------------

account_strategy: Single Account
target_account_name: FINTECHCORP

snowflake_org_name: FINTECHCORP
object_component_order: <domain>_<dataproduct>_<env>
platform_database_name: INFRA
governance_name: GOVERNANCE

data_product_name: core
data_product_domain: payments
data_product_environment: dev
data_product_description: >-
  Development environment for the core payments data product. Used by the data
  engineering team to build and test pipelines against masked or synthetic
  payment data.

scim_prefix: OKTA

# AUTO-ANSWERED on retention: 1 day Time Travel in dev, exactly as specified.
data_zones:
  - name: raw
    description: Development copy of raw payment source data. Masked or synthetic only - production cardholder data must not land here.
    time_travel_days: 1
  - name: curated
    description: Development curated payment entities.
    time_travel_days: 1
  - name: analytics
    description: Development reporting models and feature tables.
    time_travel_days: 1

# ASSUMPTION: same schema layout as prod so code promotes without rewrites.
schema_configuration:
  - zone: raw
    schemas: card_transactions, bank_transfers, merchants, customers, ledger_entries, gateway_events
  - zone: curated
    schemas: transactions, settlements, merchants, customers, chargebacks, ledger
  - zone: analytics
    schemas: revenue, settlement_reconciliation, fraud_features, merchant_performance, regulatory_reporting

# ASSUMPTION: two warehouses. TRANSFORM doubles as the interactive development
# warehouse. XSMALL with a 60-second auto-suspend keeps idle cost near zero, and
# the short statement timeouts stop a bad development query from burning credits
# overnight.
warehouse_configuration:
  - name: LOAD
    workload: LOAD
    size: XSMALL
    min_cluster_count: 1
    max_cluster_count: 1
    auto_suspend_seconds: 60
    timeout_minutes: 30
    comment: Ingestion warehouse for payments core dev.
  - name: TRANSFORM
    workload: TRANSFORM
    size: XSMALL
    min_cluster_count: 1
    max_cluster_count: 2
    auto_suspend_seconds: 60
    timeout_minutes: 60
    comment: Development and transformation warehouse for payments core dev. Multi-cluster so concurrent developers do not queue behind each other.

# -----------------------------------------------------------------------------
# TASK 4 - CONSUMER ACCESS
# -----------------------------------------------------------------------------

# ASSUMPTION: developers get broad read across all three dev zones, which is safe
# only because dev holds no production cardholder data. Analysts and data
# scientists consume prod, not dev.
custom_read_roles:
  - name: DEVELOPER
    description: Data engineering. Read access across all dev zones for pipeline development and debugging.
    schema_access: raw, curated, analytics

# -----------------------------------------------------------------------------
# TASK 5 - DATA PRODUCT COST MANAGEMENT
# -----------------------------------------------------------------------------

# ASSUMPTION: 400 of the 3000 account credits. Dev totals with staging (400) and
# prod (1800) to 2600, leaving 400 credits of headroom under the account monitor.
resource_monitor_credits: 400
resource_monitor_frequency: MONTHLY

notification_email: alex@fintechcorp.com
